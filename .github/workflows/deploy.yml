name: Deploy site

# Publishes the whole raemone.github.io site: the Astro portfolio built from
# whois/ and served at the root, plus the existing demo pages that live at the
# repository root and keep their own paths.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Let an in-flight deploy finish rather than cancelling it mid-publish.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: whois/package-lock.json

      - name: Install dependencies
        working-directory: whois
        run: npm ci

      - name: Type-check
        working-directory: whois
        run: npx astro check

      - name: Test
        working-directory: whois
        run: npx vitest run

      - name: Build portfolio
        working-directory: whois
        run: npx astro build

      - name: Assemble site
        run: |
          mkdir -p _site
          # Everything already published from the repository root (demo pages,
          # images, sample apps) is copied across untouched.
          rsync -a \
            --exclude '_site' \
            --exclude 'whois' \
            --exclude '.git' \
            --exclude '.github' \
            --exclude 'node_modules' \
            ./ _site/
          # The portfolio is the site root, so it lands on top of the copy above.
          # It brings its own index.html and 404.html; GitHub Pages serves a 404
          # only from the root, so the portfolio's doubles as the site-wide one.
          cp -r whois/dist/. _site/
          # The portfolio used to live at /whois/, so anything already shared
          # pointing there is redirected to its new home rather than 404ing.
          # Safe to delete once those links have aged out.
          mkdir -p _site/whois
          cat > _site/whois/index.html <<'HTML'
          <!DOCTYPE html>
          <html lang="en">
            <head>
              <meta charset="utf-8" />
              <title>Redirecting</title>
              <link rel="canonical" href="https://raemone.github.io/" />
              <meta http-equiv="refresh" content="0; url=/" />
              <meta name="robots" content="noindex" />
            </head>
            <body>
              <p>This page moved to <a href="/">raemone.github.io</a>.</p>
            </body>
          </html>
          HTML
          # Jekyll would otherwise skip Astro's _astro/ asset directory.
          touch _site/.nojekyll

      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
